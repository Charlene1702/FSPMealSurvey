<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Meal Plate Split</title>
    <!-- Load Chart.js safely from official CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f7fb; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
        .container { max-width: 500px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; box-sizing: border-box; }
        h1 { color: #111827; margin-bottom: 10px; font-size: 22px; }
        p { color: #4b5563; line-height: 1.5; font-size: 14px; margin-bottom: 20px; }
        .chart-box { max-width: 280px; margin: 0 auto 20px auto; }
        
        /* Sliders / Toggles Styling */
        .controls { margin-top: 20px; text-align: left; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; }
        .control-group { margin-bottom: 12px; }
        .control-group:last-child { margin-bottom: 0; }
        .control-label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; font-size: 13px; }
        .slider { width: 100%; height: 8px; border-radius: 5px; appearance: none; background: #e5e7eb; outline: none; }
        .slider::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; border-radius: 50%; cursor: pointer; }
        
        #slider-veg::-webkit-slider-thumb { background: #22c55e; }
        #slider-protein::-webkit-slider-thumb { background: #ef4444; }
        #slider-carbs::-webkit-slider-thumb { background: #eab308; }

        .btn { background-color: #10b981; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-top: 20px; width: 100%; }
        .btn:hover { background-color: #059669; }
        .copied-msg { color: #16a34a; font-weight: bold; margin-top: 12px; display: none; font-size: 14px; }
        .instructions { font-size: 12px; color: #6b7280; margin-top: 15px; border-top: 1px dashed #d1d5db; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Your Daily Meal Plate Split</h1>
        <p>Adjust the toggles below to match what your typical daily meals look like.</p>
        
        <!-- The Interactive Circle -->
        <div class="chart-box">
            <canvas id="mealChart"></canvas>
        </div>

        <!-- The Interactive Sliders -->
        <div class="controls">
            <div class="control-group">
                <div class="control-label" style="color: #15803d;">
                    <span>Fruit & Veg</span>
                    <span id="val-veg">34%</span>
                </div>
                <input type="range" id="slider-veg" class="slider" min="0" max="100" value="34">
            </div>

            <div class="control-group">
                <div class="control-label" style="color: #b91c1c;">
                    <span>Protein</span>
                    <span id="val-protein">33%</span>
                </div>
                <input type="range" id="slider-protein" class="slider" min="0" max="100" value="33">
            </div>

            <div class="control-group">
                <div class="control-label" style="color: #a16207;">
                    <span>Carbs</span>
                    <span id="val-carbs">33%</span>
                </div>
                <input type="range" id="slider-carbs" class="slider" min="0" max="100" value="33">
            </div>
        </div>

        <button class="btn" onclick="copyData()">Copy My Percentages</button>
        <div id="copiedNotice" class="copied-msg">✓ Copied! Switch back to your survey tab and paste it.</div>
        
        <p class="instructions">After copying, you can close this window and resume your survey.</p>
    </div>

    <script>
        // Set initial starting distribution values
        let values = { veg: 34, protein: 33, carbs: 33 };

        // Initialize Chart.js configuration correctly mapping to index 0 element
        const ctx = document.getElementById('mealChart').getContext('2d');
        const mealChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['Fruit & Veg', 'Protein', 'Carbs'],
                datasets: [{
                    data: [values.veg, values.protein, values.carbs],
                    backgroundColor: ['#22c55e', '#ef4444', '#eab308'],
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } }
            }
        });

        // Track UI slider inputs
        const sliders = {
            veg: document.getElementById('slider-veg'),
            protein: document.getElementById('slider-protein'),
            carbs: document.getElementById('slider-carbs')
        };

        // Track UI percentage text blocks
        const labels = {
            veg: document.getElementById('val-veg'),
            protein: document.getElementById('val-protein'),
            carbs: document.getElementById('val-carbs')
        };

        // Proportional balancing logic ensuring dynamic total matches 100% exactly
        function balanceSliders(changedKey) {
            let newValue = parseInt(sliders[changedKey].value);
            values[changedKey] = newValue;

            let otherKeys = Object.keys(values).filter(k => k !== changedKey);
            let targetFirstKey = otherKeys[0];
            let targetSecondKey = otherKeys[1];

            let remainder = 100 - newValue;
            let currentOthersSum = values[targetFirstKey] + values[targetSecondKey];

            if (currentOthersSum > 0) {
                // Distribute remainder proportionally between the other two slices
                values[targetFirstKey] = Math.round(remainder * (values[targetFirstKey] / currentOthersSum));
                values[targetSecondKey] = remainder - values[targetFirstKey];
            } else {
                // If both were zero, split evenly
                let half = Math.floor(remainder / 2);
                values[targetFirstKey] = half;
                values[targetSecondKey] = remainder - half;
            }

            // Guard rails to make sure no calculations drop below 0% or above 100%
            Object.keys(values).forEach(k => {
                if (values[k] < 0) values[k] = 0;
                if (values[k] > 100) values[k] = 100;
            });

            // Re-sync labels and inputs across everything 
            Object.keys(values).forEach(k => {
                sliders[k].value = values[k];
                labels[k].textContent = values[k] + '%';
            });

            // Update Chart.js datasets structure correctly using indexed references
            mealChart.data.datasets[0].data = [values.veg, values.protein, values.carbs];
            mealChart.update();
        }

        // Attach standard events to track updates smoothly
        sliders.veg.addEventListener('input', () => balanceSliders('veg'));
        sliders.protein.addEventListener('input', () => balanceSliders('protein'));
        sliders.carbs.addEventListener('input', () => balanceSliders('carbs'));

        // Format clipboard output string
        function copyData() {
            const dataString = `Fruit & Veg: ${values.veg}%, Protein: ${values.protein}%, Carbs: ${values.carbs}%`;
            navigator.clipboard.writeText(dataString).then(() => {
                const notice = document.getElementById('copiedNotice');
                notice.style.display = 'block';
                setTimeout(() => { notice.style.display = 'none'; }, 4000);
            });
        }
    </script>

</body>
</html>
